<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>方案 A：Immersive Composer 沉浸式</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #fafaf9;
      --text: #1c1917;
      --text-secondary: #57534e;
      --text-muted: #a8a29e;
      --border: #e7e5e4;
      --primary: #59A674;
      --primary-soft: rgba(89,166,116,0.08);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      overflow-x: hidden;
    }

    /* 动态背景光晕 */
    .ambient {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .ambient::before, .ambient::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.5;
    }
    .ambient::before {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(89,166,116,0.18), transparent 70%);
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      animation: breathe 8s ease-in-out infinite;
    }
    .ambient::after {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(139,92,246,0.1), transparent 70%);
      top: 200px;
      left: 30%;
      animation: breathe 10s ease-in-out infinite reverse;
    }
    @keyframes breathe {
      0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.5; }
      50% { transform: translateX(-50%) scale(1.15); opacity: 0.7; }
    }

    .stage {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 64px 32px 48px;
    }

    /* 顶部问候 */
    .greeting {
      font-size: 13px;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      margin-bottom: 48px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .greeting .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--primary);
      box-shadow: 0 0 0 3px rgba(89,166,116,0.2);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* 中央主区 */
    .composer {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .composer-title {
      font-size: 44px;
      font-weight: 300;
      letter-spacing: -0.03em;
      margin-bottom: 16px;
      line-height: 1.1;
    }
    .composer-title strong {
      font-weight: 600;
      background: linear-gradient(135deg, var(--primary), #3d8b5a);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .composer-sub {
      font-size: 15px;
      color: var(--text-secondary);
      margin-bottom: 40px;
      max-width: 440px;
    }

    /* 输入框 */
    .input-shell {
      width: 100%;
      position: relative;
      background: white;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 6px 6px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 8px 32px -12px rgba(15,23,42,0.08), 0 2px 8px -4px rgba(15,23,42,0.04);
      transition: all 0.3s ease;
    }
    .input-shell:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(89,166,116,0.12), 0 12px 40px -12px rgba(89,166,116,0.2);
      transform: translateY(-2px);
    }
    .input-shell i.fa-wand {
      color: var(--primary);
      font-size: 16px;
    }
    .input-shell input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 16px;
      color: var(--text);
      outline: none;
      padding: 18px 0;
      font-weight: 400;
    }
    .input-shell input::placeholder { color: var(--text-muted); }
    .send-btn {
      width: 44px;
      height: 44px;
      border: none;
      background: var(--primary);
      color: white;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
    }
    .send-btn:hover {
      background: #4a8f63;
      transform: scale(1.05);
    }

    /* 示例 chips */
    .examples {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 20px;
    }
    .example-chip {
      padding: 7px 14px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s;
    }
    .example-chip:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-soft);
    }

    /* 三个入口 - 极简文字链接式 */
    .entries {
      display: flex;
      gap: 48px;
      margin-top: 64px;
      padding-top: 40px;
      border-top: 1px solid var(--border);
      width: 100%;
      max-width: 680px;
      justify-content: center;
    }
    .entry {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.25s ease;
      position: relative;
      padding: 8px 16px;
    }
    .entry i {
      font-size: 22px;
      color: var(--text-secondary);
      transition: all 0.25s ease;
    }
    .entry-label {
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
    }
    .entry-desc {
      font-size: 11px;
      color: var(--text-muted);
    }
    .entry:hover {
      transform: translateY(-3px);
    }
    .entry:hover i {
      color: var(--primary);
    }
    .entry::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 2px;
      background: var(--primary);
      transition: width 0.25s ease;
      border-radius: 2px;
    }
    .entry:hover::after { width: 32px; }

    /* 底部最近创作 - 横向滚动 */
    .recent {
      width: 100%;
      max-width: 960px;
      margin-top: 56px;
    }
    .recent-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding: 0 4px;
    }
    .recent-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    .recent-action {
      font-size: 12px;
      color: var(--primary);
      cursor: pointer;
    }
    .recent-scroll {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 8px;
      scrollbar-width: thin;
    }
    .recent-scroll::-webkit-scrollbar { height: 6px; }
    .recent-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .recent-card {
      flex-shrink: 0;
      width: 200px;
      padding: 16px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .recent-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px -8px rgba(15,23,42,0.1);
    }
    .recent-card-top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .recent-card-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--primary-soft);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }
    .recent-card-tag {
      font-size: 10px;
      color: var(--text-muted);
      margin-left: auto;
    }
    .recent-card-title {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .recent-card-time {
      font-size: 11px;
      color: var(--text-muted);
    }

    @media (max-width: 768px) {
      .stage { padding: 40px 20px; }
      .composer-title { font-size: 32px; }
      .entries { gap: 24px; flex-wrap: wrap; }
      .entry-desc { display: none; }
    }
  </style>
</head>
<body>
  <div class="ambient"></div>
  <div class="stage">
    <div class="greeting">
      <span class="dot"></span>
      <span>下午好，准备好创作了</span>
    </div>

    <div class="composer">
      <h1 class="composer-title">你想创作<strong>什么</strong>？</h1>
      <p class="composer-sub">用一句话描述你的需求，AI 会自动选择最合适的创作方式</p>

      <div class="input-shell">
        <i class="fa-solid fa-wand-magic-sparkles"></i>
        <input type="text" placeholder="例如：给客户写一份产品方案 PPT...">
        <button class="send-btn"><i class="fa-solid fa-arrow-up"></i></button>
      </div>

      <div class="examples">
        <span class="example-chip">销售周报</span>
        <span class="example-chip">客户方案 PPT</span>
        <span class="example-chip">竞品对比表</span>
        <span class="example-chip">营销文案</span>
      </div>
    </div>

    <div class="entries">
      <div class="entry">
        <i class="fa-solid fa-wand-magic-sparkles"></i>
        <div class="entry-label">场景创作</div>
        <div class="entry-desc">智能生成</div>
      </div>
      <div class="entry">
        <i class="fa-solid fa-layer-group"></i>
        <div class="entry-label">内容模板</div>
        <div class="entry-desc">结构化模板</div>
      </div>
      <div class="entry">
        <i class="fa-solid fa-folder-open"></i>
        <div class="entry-label">我的文档</div>
        <div class="entry-desc">创作成果</div>
      </div>
    </div>

    <div class="recent">
      <div class="recent-header">
        <div class="recent-title">最近创作</div>
        <div class="recent-action">查看全部 →</div>
      </div>
      <div class="recent-scroll">
        <div class="recent-card">
          <div class="recent-card-top">
            <div class="recent-card-icon"><i class="fa-regular fa-file-lines"></i></div>
            <span class="recent-card-tag">场景</span>
          </div>
          <div class="recent-card-title">Q3 销售周报</div>
          <div class="recent-card-time">10 分钟前</div>
        </div>
        <div class="recent-card">
          <div class="recent-card-top">
            <div class="recent-card-icon"><i class="fa-regular fa-file-powerpoint"></i></div>
            <span class="recent-card-tag">模板</span>
          </div>
          <div class="recent-card-title">客户方案 PPT</div>
          <div class="recent-card-time">2 小时前</div>
        </div>
        <div class="recent-card">
          <div class="recent-card-top">
            <div class="recent-card-icon"><i class="fa-regular fa-table"></i></div>
            <span class="recent-card-tag">场景</span>
          </div>
          <div class="recent-card-title">竞品对比表</div>
          <div class="recent-card-time">昨天</div>
        </div>
        <div class="recent-card">
          <div class="recent-card-top">
            <div class="recent-card-icon"><i class="fa-regular fa-file-lines"></i></div>
            <span class="recent-card-tag">模板</span>
          </div>
          <div class="recent-card-title">客服标准话术</div>
          <div class="recent-card-time">3 天前</div>
        </div>
        <div class="recent-card">
          <div class="recent-card-top">
            <div class="recent-card-icon"><i class="fa-regular fa-envelope"></i></div>
            <span class="recent-card-tag">场景</span>
          </div>
          <div class="recent-card-title">商务跟进邮件</div>
          <div class="recent-card-time">上周</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
