<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>方案一：AI Command Center</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --border: #e2e8f0;
      --primary: #59A674;
      --primary-light: #dcfce7;
      --shadow-sm: 0 1px 2px 0 rgba(15,23,42,0.04);
      --shadow: 0 4px 16px -4px rgba(15,23,42,0.08);
      --shadow-lg: 0 12px 32px -8px rgba(15,23,42,0.12);
      --radius: 16px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }
    .preview-wrapper {
      max-width: 1200px;
      margin: 0 auto;
      padding: 48px 32px;
    }
    .page-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 40px;
    }
    .page-header i {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--primary), #3d8b5a);
      color: white;
      border-radius: 12px;
      font-size: 18px;
    }
    .page-title {
      font-size: 24px;
      font-weight: 700;
    }
    .page-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Hero / Command Input */
    .hero {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 48px 56px;
      box-shadow: var(--shadow);
      margin-bottom: 32px;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -10%;
      width: 120%;
      height: 200%;
      background: radial-gradient(circle at 50% 0%, rgba(89,166,116,0.08), transparent 60%);
      pointer-events: none;
    }
    .hero-greeting {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      position: relative;
    }
    .hero-sub {
      color: var(--text-secondary);
      font-size: 15px;
      margin-bottom: 28px;
      position: relative;
    }
    .command-input {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 8px 8px 8px 20px;
      transition: all 0.2s ease;
      position: relative;
      z-index: 1;
    }
    .command-input:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(89,166,116,0.12), var(--shadow);
    }
    .command-input i.fa-keyboard {
      color: var(--primary);
      font-size: 16px;
    }
    .command-input input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 16px;
      color: var(--text);
      outline: none;
      padding: 12px 0;
    }
    .command-input input::placeholder {
      color: var(--text-muted);
    }
    .kbd {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 12px;
      color: var(--text-muted);
      font-family: ui-monospace, SFMono-Regular, monospace;
    }
    .command-btn {
      padding: 12px 24px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .command-btn:hover {
      background: #4a8f63;
      transform: translateY(-1px);
    }

    /* Segmented Control */
    .segmented-control {
      display: inline-flex;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 32px;
      position: relative;
    }
    .segment {
      padding: 8px 20px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      border-radius: 10px;
      transition: all 0.2s;
      position: relative;
      z-index: 1;
    }
    .segment.active {
      color: var(--text);
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }

    /* Content Grid */
    .content-grid {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 24px;
    }

    /* Card Base */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .card-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }
    .card-action {
      font-size: 12px;
      color: var(--primary);
      cursor: pointer;
      font-weight: 500;
    }

    /* Timeline */
    .timeline {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .timeline-item {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      padding: 12px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .timeline-item:hover {
      background: var(--bg);
    }
    .timeline-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--border);
      margin-top: 8px;
      flex-shrink: 0;
      position: relative;
    }
    .timeline-dot::after {
      content: '';
      position: absolute;
      top: 14px;
      left: 4px;
      width: 2px;
      height: 40px;
      background: var(--border);
    }
    .timeline-item:last-child .timeline-dot::after { display: none; }
    .timeline-dot.active { background: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
    .timeline-content { flex: 1; min-width: 0; }
    .timeline-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .timeline-meta {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Bento Grid */
    .bento {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    .bento-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }
    .bento-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
      border-color: rgba(89,166,116,0.4);
    }
    .bento-card.wide { grid-column: span 2; }
    .bento-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: white;
      margin-bottom: 14px;
    }
    .bento-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .bento-desc {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.5;
    }
    .bento-tag {
      position: absolute;
      top: 16px;
      right: 16px;
      padding: 3px 8px;
      background: var(--bg);
      border-radius: 20px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .empty-state {
      text-align: center;
      padding: 32px 20px;
      color: var(--text-muted);
    }
    .empty-state i {
      font-size: 32px;
      margin-bottom: 12px;
      opacity: 0.5;
    }
    .empty-state p {
      font-size: 13px;
    }

    @media (max-width: 1024px) {
      .content-grid { grid-template-columns: 1fr; }
      .bento { grid-template-columns: repeat(2, 1fr); }
      .bento-card.wide { grid-column: span 2; }
    }
    @media (max-width: 640px) {
      .preview-wrapper { padding: 24px 16px; }
      .hero { padding: 32px 24px; }
      .hero-greeting { font-size: 22px; }
      .command-input { flex-wrap: wrap; }
      .command-btn { width: 100%; }
      .segmented-control { width: 100%; display: flex; }
      .segment { flex: 1; text-align: center; padding: 8px 12px; }
      .bento { grid-template-columns: 1fr; }
      .bento-card.wide { grid-column: span 1; }
    }
  </style>
</head>
<body>
  <div class="preview-wrapper">
    <div class="page-header">
      <i class="fa-solid fa-sparkles"></i>
      <div>
        <div class="page-title">智能工作</div>
        <div class="page-subtitle">AI 创作中心</div>
      </div>
    </div>

    <div class="hero">
      <div class="hero-greeting">下午好，准备好创作了吗？</div>
      <div class="hero-sub">描述你的需求，AI 会为你选择最合适的创作方式</div>
      <div class="command-input">
        <i class="fa-solid fa-keyboard"></i>
        <input type="text" placeholder="例如：给客户写一份产品方案 PPT、生成销售周报..." value="">
        <span class="kbd"><i class="fa-solid fa-command"></i> K</span>
        <button class="command-btn">开始创作</button>
      </div>
    </div>

    <div class="segmented-control">
      <div class="segment active"><i class="fa-solid fa-wand-magic-sparkles" style="margin-right:6px;"></i>场景创作</div>
      <div class="segment"><i class="fa-solid fa-layer-group" style="margin-right:6px;"></i>内容模板</div>
      <div class="segment"><i class="fa-solid fa-folder-open" style="margin-right:6px;"></i>我的文档</div>
    </div>

    <div class="content-grid">
      <div class="card">
        <div class="card-header">
          <div class="card-title">最近创作</div>
          <div class="card-action">查看全部</div>
        </div>
        <div class="timeline">
          <div class="timeline-item">
            <div class="timeline-dot active"></div>
            <div class="timeline-content">
              <div class="timeline-title">Q3 销售周报</div>
              <div class="timeline-meta">场景创作 · 10 分钟前</div>
            </div>
          </div>
          <div class="timeline-item">
            <div class="timeline-dot"></div>
            <div class="timeline-content">
              <div class="timeline-title">客户方案 PPT</div>
              <div class="timeline-meta">内容模板 · 2 小时前</div>
            </div>
          </div>
          <div class="timeline-item">
            <div class="timeline-dot"></div>
            <div class="timeline-content">
              <div class="timeline-title">竞品对比表</div>
              <div class="timeline-meta">场景创作 · 昨天</div>
            </div>
          </div>
          <div class="timeline-item">
            <div class="timeline-dot"></div>
            <div class="timeline-content">
              <div class="timeline-title">客服标准话术</div>
              <div class="timeline-meta">内容模板 · 3 天前</div>
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="card-title">推荐场景</div>
          <div class="card-action">浏览全部</div>
        </div>
        <div class="bento">
          <div class="bento-card wide" style="background: linear-gradient(135deg, rgba(89,166,116,0.08), rgba(89,166,116,0.02));">
            <div class="bento-icon" style="background: linear-gradient(135deg, #59A674, #3d8b5a);"><i class="fa-solid fa-chart-line"></i></div>
            <div class="bento-title">销售周报生成</div>
            <div class="bento-desc">输入本周销售数据，自动生成结构清晰的周报，包含趋势分析和下周计划。</div>
          </div>
          <div class="bento-card">
            <div class="bento-icon" style="background: linear-gradient(135deg, #3b82f6, #60a5fa);"><i class="fa-solid fa-file-powerpoint"></i></div>
            <div class="bento-title">客户方案</div>
            <div class="bento-desc">一句话生成专业 PPT</div>
            <span class="bento-tag">热门</span>
          </div>
          <div class="bento-card">
            <div class="bento-icon" style="background: linear-gradient(135deg, #8b5cf6, #a78bfa);"><i class="fa-solid fa-scale-balanced"></i></div>
            <div class="bento-title">竞品对比</div>
            <div class="bento-desc">多维度产品分析</div>
          </div>
          <div class="bento-card">
            <div class="bento-icon" style="background: linear-gradient(135deg, #f59e0b, #fbbf24);"><i class="fa-solid fa-bullhorn"></i></div>
            <div class="bento-title">营销文案</div>
            <div class="bento-desc">多平台文案适配</div>
          </div>
          <div class="bento-card">
            <div class="bento-icon" style="background: linear-gradient(135deg, #ec4899, #f472b6);"><i class="fa-solid fa-headset"></i></div>
            <div class="bento-title">客服回复</div>
            <div class="bento-desc">专业且贴心的回复</div>
          </div>
          <div class="bento-card">
            <div class="bento-icon" style="background: linear-gradient(135deg, #14b8a6, #2dd4bf);"><i class="fa-solid fa-envelope"></i></div>
            <div class="bento-title">商务邮件</div>
            <div class="bento-desc">正式邮件一键成文</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
