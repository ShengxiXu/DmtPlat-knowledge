<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>方案二：AI Conversation Workspace</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --sidebar: #f1f5f9;
      --text: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --border: #e2e8f0;
      --primary: #59A674;
      --primary-light: #dcfce7;
      --shadow: 0 4px 16px -4px rgba(15,23,42,0.08);
      --shadow-lg: 0 12px 32px -8px rgba(15,23,42,0.12);
      --radius: 16px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }
    .preview-wrapper {
      display: grid;
      grid-template-columns: 260px 1fr 320px;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .sidebar-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 8px;
    }
    .sidebar-header i {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--primary);
      color: white;
      border-radius: 8px;
      font-size: 14px;
    }
    .sidebar-title {
      font-size: 14px;
      font-weight: 700;
    }
    .new-chat-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s;
    }
    .new-chat-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }
    .history-section {
      flex: 1;
      overflow-y: auto;
    }
    .history-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 0 8px;
      margin-bottom: 10px;
    }
    .history-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s;
    }
    .history-item:hover, .history-item.active {
      background: var(--surface);
      color: var(--text);
    }
    .history-item i { font-size: 12px; color: var(--text-muted); }

    /* Main Chat */
    .main {
      display: flex;
      flex-direction: column;
      background: var(--bg);
      overflow: hidden;
    }
    .main-header {
      height: 64px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      background: var(--surface);
    }
    .main-header-title {
      font-size: 15px;
      font-weight: 700;
    }
    .main-header-actions {
      display: flex;
      gap: 8px;
    }
    .icon-btn {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s;
    }
    .icon-btn:hover { border-color: var(--primary); color: var(--primary); }

    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 40px 32px;
    }
    .welcome {
      max-width: 640px;
      margin: 0 auto 40px;
      text-align: center;
    }
    .welcome-avatar {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, var(--primary), #3d8b5a);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 28px;
      box-shadow: 0 12px 32px rgba(89,166,116,0.3);
    }
    .welcome-title {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .welcome-sub {
      font-size: 15px;
      color: var(--text-secondary);
    }

    .quick-actions {
      max-width: 640px;
      margin: 0 auto 40px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .quick-action {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: left;
    }
    .quick-action:hover {
      border-color: var(--primary);
      transform: translateY(-1px);
      box-shadow: var(--shadow);
    }
    .quick-action i {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--primary-light);
      color: var(--primary);
      border-radius: 10px;
      font-size: 14px;
      flex-shrink: 0;
    }
    .quick-action-text {
      font-size: 14px;
      font-weight: 600;
    }
    .quick-action-desc {
      font-size: 12px;
      color: var(--text-muted);
    }

    .input-area {
      padding: 20px 32px 32px;
      background: var(--bg);
    }
    .input-wrapper {
      max-width: 720px;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 6px 6px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow);
      transition: all 0.2s;
    }
    .input-wrapper:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(89,166,116,0.12), var(--shadow);
    }
    .input-wrapper i { color: var(--text-muted); }
    .input-wrapper input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 15px;
      outline: none;
      padding: 12px 0;
    }
    .input-actions {
      display: flex;
      gap: 8px;
    }
    .input-actions button {
      width: 40px;
      height: 40px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .input-actions button.send {
      background: var(--primary);
      color: white;
    }
    .input-actions button:hover { background: var(--bg); }
    .input-actions button.send:hover { background: #4a8f63; }
    .input-tips {
      max-width: 720px;
      margin: 12px auto 0;
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .input-tip {
      padding: 5px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 12px;
      color: var(--text-secondary);
      cursor: pointer;
    }
    .input-tip:hover { border-color: var(--primary); color: var(--primary); }

    /* Right Panel */
    .right-panel {
      background: var(--surface);
      border-left: 1px solid var(--border);
      padding: 24px;
      overflow-y: auto;
    }
    .panel-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
    }
    .template-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .template-card:hover {
      border-color: var(--primary);
      transform: translateX(2px);
    }
    .template-card i {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--primary);
      border-radius: 10px;
      font-size: 14px;
    }
    .template-name { font-size: 13px; font-weight: 600; }
    .template-desc { font-size: 11px; color: var(--text-muted); }

    @media (max-width: 1200px) {
      .preview-wrapper { grid-template-columns: 220px 1fr; }
      .right-panel { display: none; }
    }
    @media (max-width: 768px) {
      .preview-wrapper { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .chat-area { padding: 24px 16px; }
      .quick-actions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="preview-wrapper">
    <aside class="sidebar">
      <div class="sidebar-header">
        <i class="fa-solid fa-sparkles"></i>
        <div class="sidebar-title">AI 创作中心</div>
      </div>
      <button class="new-chat-btn"><i class="fa-solid fa-plus"></i> 新建创作</button>
      <div class="history-section">
        <div class="history-title">最近会话</div>
        <div class="history-item active"><i class="fa-regular fa-message"></i> 新的创作</div>
        <div class="history-item"><i class="fa-regular fa-file-lines"></i> Q3 销售周报</div>
        <div class="history-item"><i class="fa-regular fa-file-powerpoint"></i> 客户方案 PPT</div>
        <div class="history-item"><i class="fa-regular fa-table"></i> 竞品对比表</div>
        <div class="history-item"><i class="fa-regular fa-file-lines"></i> 客服标准话术</div>
        <div class="history-title">更多入口</div>
        <div class="history-item"><i class="fa-solid fa-layer-group"></i> 内容模板库</div>
        <div class="history-item"><i class="fa-solid fa-folder-open"></i> 我的文档</div>
      </div>
    </aside>

    <main class="main">
      <header class="main-header">
        <div class="main-header-title">新的创作</div>
        <div class="main-header-actions">
          <button class="icon-btn"><i class="fa-solid fa-folder-open"></i></button>
          <button class="icon-btn"><i class="fa-solid fa-ellipsis"></i></button>
        </div>
      </header>

      <div class="chat-area">
        <div class="welcome">
          <div class="welcome-avatar"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
          <div class="welcome-title">我能为你创作什么？</div>
          <div class="welcome-sub">告诉我你的需求，或选择一个快捷方式开始创作</div>
        </div>

        <div class="quick-actions">
          <button class="quick-action">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
            <div>
              <div class="quick-action-text">场景创作</div>
              <div class="quick-action-desc">一句话生成专业内容</div>
            </div>
          </button>
          <button class="quick-action">
            <i class="fa-solid fa-layer-group"></i>
            <div>
              <div class="quick-action-text">内容模板</div>
              <div class="quick-action-desc">结构化模板快速生成</div>
            </div>
          </button>
          <button class="quick-action">
            <i class="fa-solid fa-folder-open"></i>
            <div>
              <div class="quick-action-text">我的文档</div>
              <div class="quick-action-desc">管理所有创作成果</div>
            </div>
          </button>
          <button class="quick-action">
            <i class="fa-solid fa-file-import"></i>
            <div>
              <div class="quick-action-text">导入创作</div>
              <div class="quick-action-desc">基于现有文档继续</div>
            </div>
          </button>
        </div>
      </div>

      <div class="input-area">
        <div class="input-wrapper">
          <i class="fa-solid fa-paperclip"></i>
          <input type="text" placeholder="描述你的创作需求...">
          <div class="input-actions">
            <button><i class="fa-solid fa-microphone"></i></button>
            <button class="send"><i class="fa-solid fa-arrow-up"></i></button>
          </div>
        </div>
        <div class="input-tips">
          <span class="input-tip">生成销售周报</span>
          <span class="input-tip">写客户方案 PPT</span>
          <span class="input-tip">做竞品对比</span>
          <span class="input-tip">写营销文案</span>
        </div>
      </div>
    </main>

    <aside class="right-panel">
      <div class="panel-title">推荐模板</div>
      <div class="template-card">
        <i class="fa-solid fa-chart-line"></i>
        <div>
          <div class="template-name">销售周报</div>
          <div class="template-desc">数据驱动，自动生成分析</div>
        </div>
      </div>
      <div class="template-card">
        <i class="fa-solid fa-file-powerpoint"></i>
        <div>
          <div class="template-name">客户方案 PPT</div>
          <div class="template-desc">商务正式风格</div>
        </div>
      </div>
      <div class="template-card">
        <i class="fa-solid fa-scale-balanced"></i>
        <div>
          <div class="template-name">竞品对比表</div>
          <div class="template-desc">多维度结构化对比</div>
        </div>
      </div>
      <div class="template-card">
        <i class="fa-solid fa-bullhorn"></i>
        <div>
          <div class="template-name">营销文案</div>
          <div class="template-desc">多平台风格适配</div>
        </div>
      </div>
      <div class="template-card">
        <i class="fa-solid fa-headset"></i>
        <div>
          <div class="template-name">客服话术</div>
          <div class="template-desc">专业且有温度</div>
        </div>
      </div>
    </aside>
  </div>
</body>
</html>
