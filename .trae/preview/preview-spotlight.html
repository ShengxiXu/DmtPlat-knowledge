<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>方案 C：Spotlight Command 聚光灯</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0f0f10;
      --surface: #1a1a1c;
      --surface-2: #232326;
      --surface-hover: #2a2a2e;
      --text: #f5f5f4;
      --text-secondary: #a8a29e;
      --text-muted: #78716c;
      --border: #2a2a2e;
      --primary: #59A674;
      --primary-soft: rgba(89,166,116,0.15);
      --primary-glow: rgba(89,166,116,0.4);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      overflow-x: hidden;
    }

    /* 背景光效 */
    .bg-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(ellipse 800px 400px at 50% 0%, rgba(89,166,116,0.12), transparent 60%),
        radial-gradient(ellipse 600px 300px at 80% 100%, rgba(139,92,246,0.08), transparent 60%);
    }
    .bg-grid {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
    }

    .stage {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      padding: 56px 32px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 顶部品牌 */
    .topbar {
      width: 100%;
      max-width: 720px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 48px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, var(--primary), #3d8b5a);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 12px;
      box-shadow: 0 4px 12px rgba(89,166,116,0.3);
    }
    .brand-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }
    .topbar-actions {
      display: flex;
      gap: 8px;
    }
    .topbar-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }
    .topbar-btn:hover { background: var(--surface-hover); color: var(--text); }

    /* 聚光灯输入框 */
    .spotlight {
      width: 100%;
      max-width: 720px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 24px 64px -16px rgba(0,0,0,0.6), 0 8px 24px -8px rgba(0,0,0,0.4);
      transition: all 0.25s ease;
    }
    .spotlight.focused {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px var(--primary-soft), 0 32px 80px -16px rgba(89,166,116,0.25), 0 8px 24px -8px rgba(0,0,0,0.4);
    }
    .spotlight-input-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 20px;
    }
    .spotlight-icon {
      color: var(--primary);
      font-size: 18px;
    }
    .spotlight-input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 17px;
      color: var(--text);
      outline: none;
      font-weight: 400;
    }
    .spotlight-input::placeholder { color: var(--text-muted); }
    .kbd {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 11px;
      color: var(--text-muted);
      font-family: ui-monospace, monospace;
    }

    /* AI 智能建议面板 */
    .suggestions {
      border-top: 1px solid var(--border);
      padding: 8px;
    }
    .suggestions-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      padding: 8px 12px 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .suggestions-label i { color: var(--primary); font-size: 10px; }
    .suggestion {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .suggestion:hover, .suggestion.active {
      background: var(--surface-hover);
    }
    .suggestion.active {
      background: var(--primary-soft);
    }
    .suggestion-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--surface-2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: var(--text-secondary);
      flex-shrink: 0;
    }
    .suggestion.active .suggestion-icon {
      background: var(--primary);
      color: white;
    }
    .suggestion-info { flex: 1; min-width: 0; }
    .suggestion-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
    }
    .suggestion-desc {
      font-size: 11px;
      color: var(--text-muted);
    }
    .suggestion-tag {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 10px;
      background: var(--surface-2);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    /* 底部入口 */
    .entries {
      display: flex;
      gap: 12px;
      margin-top: 32px;
      width: 100%;
      max-width: 720px;
    }
    .entry-card {
      flex: 1;
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .entry-card:hover {
      border-color: var(--primary);
      background: var(--surface-hover);
      transform: translateY(-2px);
    }
    .entry-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: white;
      flex-shrink: 0;
    }
    .entry-text { flex: 1; min-width: 0; }
    .entry-title { font-size: 13px; font-weight: 600; }
    .entry-desc { font-size: 11px; color: var(--text-muted); }
    .entry-arrow {
      color: var(--text-muted);
      font-size: 11px;
    }

    /* 最近创作 */
    .recent-section {
      width: 100%;
      max-width: 720px;
      margin-top: 40px;
    }
    .recent-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .recent-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    .recent-action {
      font-size: 11px;
      color: var(--primary);
      cursor: pointer;
    }
    .recent-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .recent-tile {
      padding: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .recent-tile:hover {
      border-color: var(--primary);
      background: var(--surface-hover);
    }
    .recent-tile-top {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .recent-tile-icon {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: var(--surface-2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: var(--primary);
    }
    .recent-tile-tag {
      font-size: 9px;
      color: var(--text-muted);
      margin-left: auto;
      padding: 1px 6px;
      background: var(--surface-2);
      border-radius: 8px;
    }
    .recent-tile-title {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .recent-tile-time {
      font-size: 10px;
      color: var(--text-muted);
    }

    @media (max-width: 768px) {
      .stage { padding: 32px 16px; }
      .entries { flex-direction: column; }
      .recent-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="bg-grid"></div>

  <div class="stage">
    <div class="topbar">
      <div class="brand">
        <div class="brand-icon"><i class="fa-solid fa-sparkles"></i></div>
        <div class="brand-name">AI 创作中心</div>
      </div>
      <div class="topbar-actions">
        <button class="topbar-btn"><i class="fa-solid fa-clock-rotate-left"></i></button>
        <button class="topbar-btn"><i class="fa-solid fa-gear"></i></button>
      </div>
    </div>

    <div class="spotlight focused">
      <div class="spotlight-input-row">
        <i class="fa-solid fa-wand-magic-sparkles spotlight-icon"></i>
        <input type="text" class="spotlight-input" placeholder="描述你想创作的内容，或输入命令..." value="">
        <span class="kbd">⌘ K</span>
      </div>

      <div class="suggestions">
        <div class="suggestions-label"><i class="fa-solid fa-bolt"></i> AI 智能推荐</div>
        <div class="suggestion active">
          <div class="suggestion-icon"><i class="fa-solid fa-chart-line"></i></div>
          <div class="suggestion-info">
            <div class="suggestion-title">生成销售周报</div>
            <div class="suggestion-desc">基于本周数据自动生成结构化周报</div>
          </div>
          <span class="suggestion-tag">场景</span>
        </div>
        <div class="suggestion">
          <div class="suggestion-icon"><i class="fa-solid fa-file-powerpoint"></i></div>
          <div class="suggestion-info">
            <div class="suggestion-title">客户方案 PPT</div>
            <div class="suggestion-desc">商务正式风格，8 页结构</div>
          </div>
          <span class="suggestion-tag">模板</span>
        </div>
        <div class="suggestion">
          <div class="suggestion-icon"><i class="fa-solid fa-scale-balanced"></i></div>
          <div class="suggestion-info">
            <div class="suggestion-title">竞品对比分析</div>
            <div class="suggestion-desc">多维度产品对比表格</div>
          </div>
          <span class="suggestion-tag">场景</span>
        </div>
        <div class="suggestion">
          <div class="suggestion-icon"><i class="fa-solid fa-bullhorn"></i></div>
          <div class="suggestion-info">
            <div class="suggestion-title">营销文案生成</div>
            <div class="suggestion-desc">小红书、公众号多平台适配</div>
          </div>
          <span class="suggestion-tag">场景</span>
        </div>
      </div>
    </div>

    <div class="entries">
      <div class="entry-card">
        <div class="entry-icon" style="background: linear-gradient(135deg, #8b5cf6, #a78bfa);"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
        <div class="entry-text">
          <div class="entry-title">场景创作</div>
          <div class="entry-desc">智能生成</div>
        </div>
        <i class="fa-solid fa-arrow-right entry-arrow"></i>
      </div>
      <div class="entry-card">
        <div class="entry-icon" style="background: linear-gradient(135deg, #3b82f6, #60a5fa);"><i class="fa-solid fa-layer-group"></i></div>
        <div class="entry-text">
          <div class="entry-title">内容模板</div>
          <div class="entry-desc">结构化模板</div>
        </div>
        <i class="fa-solid fa-arrow-right entry-arrow"></i>
      </div>
      <div class="entry-card">
        <div class="entry-icon" style="background: linear-gradient(135deg, #10b981, #34d399);"><i class="fa-solid fa-folder-open"></i></div>
        <div class="entry-text">
          <div class="entry-title">我的文档</div>
          <div class="entry-desc">创作成果</div>
        </div>
        <i class="fa-solid fa-arrow-right entry-arrow"></i>
      </div>
    </div>

    <div class="recent-section">
      <div class="recent-header">
        <div class="recent-title">最近创作</div>
        <div class="recent-action">查看全部 →</div>
      </div>
      <div class="recent-grid">
        <div class="recent-tile">
          <div class="recent-tile-top">
            <div class="recent-tile-icon"><i class="fa-regular fa-file-lines"></i></div>
            <span class="recent-tile-tag">场景</span>
          </div>
          <div class="recent-tile-title">Q3 销售周报</div>
          <div class="recent-tile-time">10 分钟前</div>
        </div>
        <div class="recent-tile">
          <div class="recent-tile-top">
            <div class="recent-tile-icon"><i class="fa-regular fa-file-powerpoint"></i></div>
            <span class="recent-tile-tag">模板</span>
          </div>
          <div class="recent-tile-title">客户方案 PPT</div>
          <div class="recent-tile-time">2 小时前</div>
        </div>
        <div class="recent-tile">
          <div class="recent-tile-top">
            <div class="recent-tile-icon"><i class="fa-regular fa-table"></i></div>
            <span class="recent-tile-tag">场景</span>
          </div>
          <div class="recent-tile-title">竞品对比表</div>
          <div class="recent-tile-time">昨天</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
