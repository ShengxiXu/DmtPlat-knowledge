<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>方案 B：Split Workspace 分栏工作区</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #ffffff;
      --sidebar: #fafaf9;
      --text: #1c1917;
      --text-secondary: #57534e;
      --text-muted: #a8a29e;
      --border: #e7e5e4;
      --border-soft: #f5f5f4;
      --primary: #59A674;
      --primary-soft: rgba(89,166,116,0.1);
      --primary-bg: #ecfdf5;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      line-height: 1.5;
      overflow: hidden;
    }
    .workspace {
      display: grid;
      grid-template-columns: 280px 1fr;
      height: 100vh;
    }

    /* 左侧栏 */
    .sidebar {
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 20px 14px;
      overflow-y: auto;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 10px 20px;
    }
    .brand-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--primary), #3d8b5a);
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 14px;
    }
    .brand-name {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .nav-section {
      margin-bottom: 24px;
    }
    .nav-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      padding: 0 10px;
      margin-bottom: 6px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: 8px;
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s;
      font-weight: 500;
    }
    .nav-item i {
      width: 16px;
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
    }
    .nav-item:hover {
      background: var(--border-soft);
      color: var(--text);
    }
    .nav-item.active {
      background: var(--primary-soft);
      color: var(--primary);
    }
    .nav-item.active i { color: var(--primary); }
    .nav-item .count {
      margin-left: auto;
      font-size: 11px;
      color: var(--text-muted);
      background: white;
      padding: 1px 7px;
      border-radius: 10px;
    }

    .recent-list {
      flex: 1;
      overflow-y: auto;
    }
    .recent-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .recent-item:hover { background: var(--border-soft); }
    .recent-item-icon {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: white;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: var(--text-secondary);
      flex-shrink: 0;
    }
    .recent-item-info { flex: 1; min-width: 0; }
    .recent-item-title {
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .recent-item-time {
      font-size: 10px;
      color: var(--text-muted);
    }

    .sidebar-footer {
      padding: 12px 10px 0;
      border-top: 1px solid var(--border);
      margin-top: 12px;
    }
    .user-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px;
      border-radius: 8px;
      cursor: pointer;
    }
    .user-card:hover { background: var(--border-soft); }
    .avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
    }
    .user-info { flex: 1; min-width: 0; }
    .user-name { font-size: 12px; font-weight: 600; }
    .user-plan { font-size: 10px; color: var(--text-muted); }

    /* 右侧主区 */
    .main {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
    }
    .main-header {
      height: 56px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
    }
    .breadcrumb {
      font-size: 13px;
      color: var(--text-muted);
    }
    .breadcrumb strong {
      color: var(--text);
      font-weight: 600;
    }
    .header-actions {
      display: flex;
      gap: 8px;
    }
    .icon-btn {
      width: 32px;
      height: 32px;
      border: 1px solid var(--border);
      background: white;
      border-radius: 8px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }
    .icon-btn:hover { border-color: var(--primary); color: var(--primary); }

    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 48px 32px;
    }
    .welcome-wrap {
      max-width: 720px;
      margin: 0 auto;
    }
    .welcome-title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }
    .welcome-sub {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 32px;
    }

    /* 输入框 */
    .composer-box {
      background: white;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 1px 3px rgba(15,23,42,0.04);
      transition: all 0.2s;
    }
    .composer-box:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(89,166,116,0.1);
    }
    .composer-input {
      width: 100%;
      border: none;
      outline: none;
      font-size: 15px;
      color: var(--text);
      font-family: inherit;
      resize: none;
      min-height: 48px;
      background: transparent;
    }
    .composer-input::placeholder { color: var(--text-muted); }
    .composer-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border-soft);
    }
    .composer-tools {
      display: flex;
      gap: 4px;
    }
    .tool-btn {
      width: 32px;
      height: 32px;
      border: none;
      background: transparent;
      border-radius: 8px;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }
    .tool-btn:hover { background: var(--border-soft); color: var(--text); }
    .composer-submit {
      padding: 8px 16px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .composer-submit:hover { background: #4a8f63; }

    /* 快捷场景网格 */
    .section-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin: 40px 0 16px;
    }
    .scene-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .scene-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .scene-card:hover {
      border-color: var(--primary);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px -4px rgba(15,23,42,0.08);
    }
    .scene-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 14px;
      flex-shrink: 0;
    }
    .scene-info { flex: 1; min-width: 0; }
    .scene-name { font-size: 13px; font-weight: 600; }
    .scene-desc { font-size: 11px; color: var(--text-muted); }

    @media (max-width: 1024px) {
      .workspace { grid-template-columns: 220px 1fr; }
      .scene-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 768px) {
      .workspace { grid-template-columns: 1fr; }
      .sidebar { display: none; }
    }
  </style>
</head>
<body>
  <div class="workspace">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon"><i class="fa-solid fa-sparkles"></i></div>
        <div class="brand-name">AI 创作中心</div>
      </div>

      <div class="nav-section">
        <div class="nav-label">创作</div>
        <div class="nav-item active">
          <i class="fa-solid fa-wand-magic-sparkles"></i>
          <span>场景创作</span>
          <span class="count">12</span>
        </div>
        <div class="nav-item">
          <i class="fa-solid fa-layer-group"></i>
          <span>内容模板</span>
          <span class="count">8</span>
        </div>
        <div class="nav-item">
          <i class="fa-solid fa-folder-open"></i>
          <span>我的文档</span>
          <span class="count">156</span>
        </div>
      </div>

      <div class="nav-section" style="flex:1; display:flex; flex-direction:column; min-height:0;">
        <div class="nav-label">最近创作</div>
        <div class="recent-list">
          <div class="recent-item">
            <div class="recent-item-icon"><i class="fa-regular fa-file-lines"></i></div>
            <div class="recent-item-info">
              <div class="recent-item-title">Q3 销售周报</div>
              <div class="recent-item-time">10 分钟前</div>
            </div>
          </div>
          <div class="recent-item">
            <div class="recent-item-icon"><i class="fa-regular fa-file-powerpoint"></i></div>
            <div class="recent-item-info">
              <div class="recent-item-title">客户方案 PPT</div>
              <div class="recent-item-time">2 小时前</div>
            </div>
          </div>
          <div class="recent-item">
            <div class="recent-item-icon"><i class="fa-regular fa-table"></i></div>
            <div class="recent-item-info">
              <div class="recent-item-title">竞品对比表</div>
              <div class="recent-item-time">昨天</div>
            </div>
          </div>
          <div class="recent-item">
            <div class="recent-item-icon"><i class="fa-regular fa-file-lines"></i></div>
            <div class="recent-item-info">
              <div class="recent-item-title">客服标准话术</div>
              <div class="recent-item-time">3 天前</div>
            </div>
          </div>
          <div class="recent-item">
            <div class="recent-item-icon"><i class="fa-regular fa-envelope"></i></div>
            <div class="recent-item-info">
              <div class="recent-item-title">商务跟进邮件</div>
              <div class="recent-item-time">上周</div>
            </div>
          </div>
        </div>
      </div>

      <div class="sidebar-footer">
        <div class="user-card">
          <div class="avatar">L</div>
          <div class="user-info">
            <div class="user-name">Lily</div>
            <div class="user-plan">专业版</div>
          </div>
          <i class="fa-solid fa-ellipsis" style="color:var(--text-muted);font-size:12px;"></i>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="main-header">
        <div class="breadcrumb">创作 / <strong>场景创作</strong></div>
        <div class="header-actions">
          <button class="icon-btn"><i class="fa-solid fa-clock-rotate-left"></i></button>
          <button class="icon-btn"><i class="fa-solid fa-question"></i></button>
        </div>
      </header>

      <div class="main-content">
        <div class="welcome-wrap">
          <h1 class="welcome-title">开始你的创作</h1>
          <p class="welcome-sub">描述需求或选择下方场景，AI 为你生成专业内容</p>

          <div class="composer-box">
            <textarea class="composer-input" placeholder="例如：给客户写一份产品方案 PPT，重点突出我们的技术优势和价格竞争力..."></textarea>
            <div class="composer-footer">
              <div class="composer-tools">
                <button class="tool-btn"><i class="fa-solid fa-paperclip"></i></button>
                <button class="tool-btn"><i class="fa-solid fa-image"></i></button>
                <button class="tool-btn"><i class="fa-solid fa-microphone"></i></button>
              </div>
              <button class="composer-submit"><i class="fa-solid fa-paper-plane" style="margin-right:6px;"></i>开始创作</button>
            </div>
          </div>

          <div class="section-title">快捷场景</div>
          <div class="scene-grid">
            <div class="scene-card">
              <div class="scene-icon" style="background: linear-gradient(135deg, #59A674, #3d8b5a);"><i class="fa-solid fa-chart-line"></i></div>
              <div class="scene-info">
                <div class="scene-name">销售周报</div>
                <div class="scene-desc">数据驱动分析</div>
              </div>
            </div>
            <div class="scene-card">
              <div class="scene-icon" style="background: linear-gradient(135deg, #3b82f6, #60a5fa);"><i class="fa-solid fa-file-powerpoint"></i></div>
              <div class="scene-info">
                <div class="scene-name">客户方案</div>
                <div class="scene-desc">商务 PPT 生成</div>
              </div>
            </div>
            <div class="scene-card">
              <div class="scene-icon" style="background: linear-gradient(135deg, #8b5cf6, #a78bfa);"><i class="fa-solid fa-scale-balanced"></i></div>
              <div class="scene-info">
                <div class="scene-name">竞品对比</div>
                <div class="scene-desc">多维度分析</div>
              </div>
            </div>
            <div class="scene-card">
              <div class="scene-icon" style="background: linear-gradient(135deg, #f59e0b, #fbbf24);"><i class="fa-solid fa-bullhorn"></i></div>
              <div class="scene-info">
                <div class="scene-name">营销文案</div>
                <div class="scene-desc">多平台适配</div>
              </div>
            </div>
            <div class="scene-card">
              <div class="scene-icon" style="background: linear-gradient(135deg, #ec4899, #f472b6);"><i class="fa-solid fa-headset"></i></div>
              <div class="scene-info">
                <div class="scene-name">客服话术</div>
                <div class="scene-desc">专业有温度</div>
              </div>
            </div>
            <div class="scene-card">
              <div class="scene-icon" style="background: linear-gradient(135deg, #14b8a6, #2dd4bf);"><i class="fa-solid fa-envelope"></i></div>
              <div class="scene-info">
                <div class="scene-name">商务邮件</div>
                <div class="scene-desc">一键成文</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
